# CI for brb.
#
# Three jobs, cheapest first:
#
#   check   gofmt, vet, build, and shellcheck over every *.sh — pinned and
#           checksummed, so this job does install one binary. No disc format,
#           none of the tools brb shells out to, ~1 minute.
#   test    the Go tests and both shell suites, against real mksquashfs/age/par2.
#   dist    the disc payload, and the offline rebuild the on-disc README promises.
#
# test and dist wait on check so a stray gofmt diff costs one minute rather than
# fifteen of par2 arithmetic, and so a red run points at one job instead of three.
#
# WHY THE ACTIONS ARE PINNED BY SHA. `actions/checkout@v5` is a branch-shaped
# tag: whoever controls that repository can move it, and the job it runs in is
# the one that builds the payload burned onto every disc. The shellcheck
# download below is checksummed for exactly that reason, and leaving the
# actions on mutable tags would have made that ceremony rather than a policy.
# So each `uses:` names a 40-character commit SHA, with the release tag it came
# from in a trailing comment — the comment is what a human reads, the SHA is
# what GitHub resolves. To move one forward:
#
#   gh api repos/actions/checkout/git/ref/tags/v5 --jq .object
#     -> {"sha": "...", "type": "commit"}      # use that sha
#     -> {"sha": "...", "type": "tag"}         # annotated: deref once more,
#        gh api repos/actions/checkout/git/tags/<sha> --jq .object.sha
#   gh api 'repos/actions/checkout/tags?per_page=100' --jq '.[]|"\(.name) \(.commit.sha)"' | grep <sha>
#     -> the vX.Y.Z that shares it, which is what the trailing comment says
#
# Verify the SHA really belongs to that repository before writing it down
# (`gh api repos/actions/checkout/commits/<sha> --jq .sha` must echo it back);
# a SHA from the wrong repository is not a pin, it is a 404 on the next run.
#
# WHY A FRESH RUNNER IS THE POINT. This repo shipped with one machine's home
# directory baked into three defaults, and that was found only because the tree
# happened to move. Every job below starts from a bare checkout with nothing
# exported, which is the only arrangement that can catch the next one: the suites
# and build-dist.sh are invoked here with no arguments and no environment at all.
#
# Copyright (c) 2026 Jonathan Zeppettini. MIT licensed — see the LICENSE file.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The dependencies here are distro packages and a disc format meant to still
  # be readable in twenty years. Nothing about that is exercised by a quiet
  # month, so run weekly: a squashfs-tools or par2 update that breaks an
  # assumption should surface on its own, not on the next unrelated push.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, vet, gofmt, shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # Pinned, and checksummed, rather than taken from apt. Ubuntu ships
      # shellcheck 0.9.0; these scripts were triaged against 0.11.0, and the two
      # do not report the same set — 0.11.0 is the one that finds the `local a=$1
      # b=$a` class. A lint gate that changes its mind when the runner image is
      # rebuilt is worse than no gate, so the version is part of the config.
      - name: Install shellcheck
        env:
          SC_VERSION: v0.11.0
          SC_SHA512: 25df28923d7d89cfdb9fa8aeef762a887f2bd4ebfbcd43ae71068c60e9458d66250b0f8d6fd66b4bc03723e6cdd47983c547e3ab4f3ea2cbc4bc4028842cc7b9
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/$SC_VERSION/shellcheck-$SC_VERSION.linux.x86_64.tar.xz"
          echo "$SC_SHA512  sc.tar.xz" | sha512sum -c -
          tar xJf sc.tar.xz
          sudo install -m 0755 "shellcheck-$SC_VERSION/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # A glob, not a list, so a script added later is covered without anyone
      # remembering to add it here. --severity=style is shellcheck's most
      # inclusive setting; all four scripts are clean at it today, and the two
      # deliberate idioms that are not are disabled at their sites with the
      # reason written next to them.
      - name: shellcheck
        run: shellcheck --severity=style --format=gcc -- *.sh

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          # Read the version out of go.mod rather than pinning it twice.
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # A clean checkout carries no vendor/ — it is gitignored, and regenerated
      # by build-dist.sh for the source tarball. Building here therefore also
      # proves go.mod and go.sum alone are enough to construct the program.
      - name: Build
        working-directory: ./go
        run: go build ./...

      - name: Vet
        working-directory: ./go
        run: go vet ./...

      - name: gofmt
        working-directory: ./go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

  test:
    name: tests and cross-compatibility suites
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install the tools brb shells out to
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools par2 xorriso locales
          # xcompat's locale round-trip is skipped unless en_US.UTF-8 exists.
          sudo locale-gen en_US.UTF-8

      - name: Install age
        run: |
          # Prefer the distro package, because that is what the README tells a
          # reader to install and so it is the path worth exercising. Fall back
          # to the exact version go.mod already depends on, which keeps CI alive
          # across runner image changes without introducing a new trust root or
          # an unpinned download.
          if sudo apt-get install -y --no-install-recommends age; then
            echo "age: from apt"
          else
            # Read the version out of go.mod rather than pinning it twice, the
            # same rule the toolchain follows above. A literal here would go
            # stale silently on the next dependency bump, and it would go stale
            # in the branch that only runs when the runner image changes — so
            # the CLI producing the on-disc format could drift away from the
            # library that writes it without any commit looking wrong.
            AGE_VER="$(go -C go list -m -f '{{.Version}}' filippo.io/age)"
            [ -n "$AGE_VER" ] || { echo "::error::could not read the age version out of go/go.mod"; exit 1; }
            echo "age: apt has no package, building $AGE_VER from the pinned module"
            go install "filippo.io/age/cmd/age@$AGE_VER"
            go install "filippo.io/age/cmd/age-keygen@$AGE_VER"
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      # THIS STEP IS LOAD-BEARING, NOT CEREMONY, and two different failures hide
      # behind it. The QUIET ones are what it is really for: a tool-dependent Go
      # test calls t.Skipf when detection fails, so a runner missing par2 reports
      # a green `go test ./...` in which the integration tests never ran at all;
      # and xcompat treats script(1), flock(1) and en_US.UTF-8 as OPTIONAL (its
      # HAVE_SCRIPT / HAVE_FLOCK / HAVE_UTF8_LOCALE gates), so without them the
      # pty sections, the staging-lock checks and the locale round-trip skip
      # themselves and the suite still exits 0. Those are why this list is
      # longer than the suites' own required list, and why script and flock are
      # on it at all.
      # A tool on that required list is already loud — xcompat exits 77 and
      # go-e2e exits 2, and a plain `run:` step fails on either — so for those
      # this step only buys a named tool now instead of a dead suite in forty
      # minutes. Neither reason is ceremony; do not trim the list to the suites'.
      - name: Every required tool must actually be present
        run: |
          missing=()
          for t in sha512sum mksquashfs unsquashfs par2 age age-keygen \
                   xorriso gzip diff find awk sed cmp sort script flock; do
            command -v "$t" >/dev/null 2>&1 || missing+=("$t")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::the suites would skip themselves; missing: ${missing[*]}"
            exit 1
          fi
          locale -a | grep -qiE '^en_US\.utf-?8$' || {
            echo "::error::no en_US.UTF-8; xcompat's locale checks would skip"
            exit 1
          }
          # squashfs-tools below 4.5 has no -cpiostyle0, which the backup path
          # depends on and whose absence is another silent t.Skip.
          mksquashfs -version | head -1
          par2 --version 2>&1 | head -1 || true
          age --version

      - name: Go tests
        working-directory: ./go
        run: go test -count=1 ./...

      - name: Go tests under the race detector
        working-directory: ./go
        run: go test -count=1 -race ./...

      # Built to ./brb, which is exactly where both suites look by default when
      # given no argument. Nothing is exported and nothing is passed.
      - name: Build the binary the suites read
        run: go -C go build -o ../brb ./cmd/brb

      - name: Cross-compatibility suite (bash reader vs Go writer)
        run: ./xcompat-test.sh

      - name: Go end-to-end suite
        run: ./go-e2e-test.sh

  dist:
    name: disc payload and offline rebuild
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # build-dist.sh is run with NO argument and BRB_DIST_OUT unset, so the
      # only thing deciding where the payload lands is the script's own
      # fallback, $HOME/brb-dist. That is what makes this step a test of the
      # default and not merely of the script: an absolute path from somebody's
      # machine baked into that fallback would put the payload somewhere the
      # steps below never look, and they would fail. HOME is pointed at a fresh,
      # empty directory for this one step so the fallback is exercised against
      # nothing pre-existing — no dotfiles, no earlier build — and so the
      # verification steps can name exactly one place, ${{ runner.temp }}/home/brb-dist,
      # to look in. (Go re-downloads its modules under the fresh HOME; that is
      # the price of an honest test and it is a few seconds.)
      - name: A fresh, empty HOME for the payload build
        run: mkdir -p "$RUNNER_TEMP/home"

      - name: Build the payload, with no argument and no environment
        env:
          HOME: ${{ runner.temp }}/home
        run: ./build-dist.sh

      - name: The published set must verify against its own SHA512SUMS
        working-directory: ${{ runner.temp }}/home/brb-dist
        run: sha512sum -c SHA512SUMS

      - name: Both binaries must be static, and the right architectures
        working-directory: ${{ runner.temp }}/home/brb-dist
        run: |
          file brb-linux-amd64 brb-linux-aarch64
          # A cross-compile that silently produced two amd64 binaries would sail
          # through every other check in this file, and strand anyone restoring
          # on an ARM machine with a binary their kernel refuses to exec.
          file brb-linux-amd64   | grep -q 'x86-64'           || exit 1
          file brb-linux-aarch64 | grep -q 'ARM aarch64'      || exit 1
          file brb-linux-amd64   | grep -q 'statically linked' || exit 1
          file brb-linux-aarch64 | grep -q 'statically linked' || exit 1
          # Static means it runs on a rescue system with no libc and no Go.
          ./brb-linux-amd64 version

      # The on-disc README tells whoever finds these discs that the source
      # tarball rebuilds with no network access. That promise is only as good as
      # the last time someone tried it, so try it on every run.
      - name: The source tarball must rebuild with the network off
        run: |
          cd "$RUNNER_TEMP"
          tar xzf home/brb-dist/brb-src.tar.gz
          cd brb-*/go
          GOPROXY=off go build -mod=vendor -o "$RUNNER_TEMP/brb-offline" ./cmd/brb
          "$RUNNER_TEMP/brb-offline" version

      # The release assets exist so that nobody renames four files by hand at
      # tag time. That only helps if the step is exercised: an untested
      # generator drifts exactly like the hand-renaming it replaced, and the
      # place it would be noticed is a published release page.
      - name: The release assets must be versioned, verified, and the same bytes
        working-directory: ${{ runner.temp }}/home/brb-dist/release
        run: |
          sha512sum -c SHA512SUMS
          v="$(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' "$GITHUB_WORKSPACE/brb.sh" | head -1)"
          test -n "$v" || { echo "could not read VERSION out of brb.sh" >&2; exit 1; }
          for f in "brb-v$v-linux-amd64" "brb-v$v-linux-aarch64" \
                   "brb-v$v.sh" "brb-v$v-src.tar.gz"; do
            test -f "$f" || { echo "missing release asset: $f" >&2; exit 1; }
          done
          # An asset that is not the payload byte for byte would put something
          # on a release page that no disc has ever carried.
          cmp "brb-v$v-linux-amd64"   ../brb-linux-amd64
          cmp "brb-v$v-linux-aarch64" ../brb-linux-aarch64
          cmp "brb-v$v.sh"            ../brb.sh
          cmp "brb-v$v-src.tar.gz"    ../brb-src.tar.gz

      # build-dist.sh runs `go mod tidy && go mod vendor` before it builds. That
      # is deliberate, and it makes this the cheapest possible dependency-drift
      # alarm: if tidy wants to change anything, the committed go.mod and go.sum
      # no longer describe the module that actually gets shipped on the discs.
      - name: go.mod and go.sum must already be tidy
        run: git diff --exit-code -- go/go.mod go/go.sum
